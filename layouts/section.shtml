<extend template="base.shtml">
<head id="head">
  <script defer src="$site.asset('toc.js').link()"></script>
  <script defer src="$site.asset('giscus.js').link()"></script>
</head>
<body id="body">
  <header class="mobile-header">
    <button class="icon-button" id="toc-toggle" aria-expanded="false" aria-controls="toc" aria-label="$i18n.get('toggle_toc')">
      <span aria-hidden="true">☰</span>
    </button>
    <a class="mobile-brand" href="/" :text="$i18n.get('site_title')"></a>
    <div class="right-buttons mobile-actions" aria-label="Page actions"></div>
  </header>

  <aside class="sidebar" id="toc">
    <div class="sidebar-header">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">Z</span>
        <span>
          <strong :text="$i18n.get('site_title')"></strong>
        </span>
      </a>
    </div>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="toc-search" type="search" placeholder="Search recipes…" aria-label="Search recipes">
      <kbd>/</kbd>
    </label>
    <nav class="toc-nav" aria-label="Table of contents">
      <ctx :html="$site.page('toc').content()"></ctx>
    </nav>
    <div class="sidebar-footer">
      <a href="https://github.com/zigcc/zig-cookbook">View on GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </aside>

  <main class="page-shell">
    <div class="topbar">
      <button class="icon-button topbar-sidebar-toggle" id="sidebar-expand" aria-label="Show table of contents">☰</button>
      <h1 class="menu-title" :text="$i18n.get('site_title')"></h1>
      <div class="right-buttons">
        <a class="topbar-icon print-button" href="#" title="Print this page" aria-label="Print this page">
          <svg aria-hidden="true" viewBox="0 0 512 512"><path d="M128 0C92.7 0 64 28.7 64 64v96h64V64h226.7L384 93.3V160h64V93.3c0-17-6.7-33.3-18.7-45.3L400 18.7C388 6.7 371.7 0 354.7 0H128zM384 352v32 64H128V384 368 352H384zm64 32h32c17.7 0 32-14.3 32-32V256c0-35.3-28.7-64-64-64H64c-35.3 0-64 28.7-64 64v96c0 17.7 14.3 32 32 32H64v64c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V384zm-16-88c-13.3 0-24-10.7-24-24s10.7-24 24-24 24 10.7 24 24-10.7 24-24 24z"></path></svg>
        </a>
        <a class="topbar-icon" href="https://github.com/zigcc/zig-cookbook" title="Git repository" aria-label="Git repository">
          <svg aria-hidden="true" viewBox="0 0 496 512"><path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.6-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-40.4-.3-61.4 0 0-70 15-84.7-29.8 0 0-11.4-29.1-27.8-36.6 0 0-22.9-15.7 1.6-15.4 0 0 24.9 2 38.6 25.8 21.9 38.6 58.6 27.5 72.9 20.9 2.3-16 8.8-27.1 16-33.7-55.9-6.2-112.3-14.3-112.3-110.5 0-27.5 7.6-41.3 23.6-58.9-2.6-6.5-11.1-33.3 2.6-67.9 20.9-6.5 69 27 69 27 20-5.6 41.5-8.5 62.8-8.5s42.8 2.9 62.8 8.5c0 0 48.1-33.6 69-27 13.7 34.7 5.2 61.4 2.6 67.9 16 17.7 25.8 31.5 25.8 58.9 0 96.5-58.9 104.2-114.8 110.5 9.2 7.9 17 22.9 17 46.4 0 33.7-.3 75.4-.3 83.6 0 6.5 4.6 14.4 17.3 12.1C428.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8z"></path></svg>
        </a>
        <a class="topbar-icon edit-button" href="https://github.com/zigcc/zig-cookbook" title="Suggest an edit" aria-label="Suggest an edit">
          <svg aria-hidden="true" viewBox="0 0 512 512"><path d="M421.7 220.3l-11.3 11.3-22.6 22.6-205 205c-6.6 6.6-14.8 11.5-23.8 14.1L30.8 511c-8.4 2.5-17.5.2-23.7-6.1S-1.5 489.7 1 481.2L38.7 353.1c2.6-9 7.5-17.2 14.1-23.8l205-205 22.6-22.6 11.3-11.3 33.9 33.9 62.1 62.1 33.9 33.9zM96 353.9l-9.3 9.3c-.9.9-1.6 2.1-2 3.4l-25.3 86 86-25.3c1.3-.4 2.5-1.1 3.4-2l9.3-9.3H112c-8.8 0-16-7.2-16-16V353.9zM453.3 19.3l39.4 39.4c25 25 25 65.5 0 90.5l-14.5 14.5-22.6 22.6-11.3 11.3-33.9-33.9-62.1-62.1-33.9-33.9 11.3-11.3 22.6-22.6 14.5-14.5c25-25 65.5-25 90.5 0z"></path></svg>
        </a>
      </div>
    </div>
    <div class="content">
      <article>
        <div id="content-header">
          <h1 :text="$page.title"></h1>
        </div>
        <div class="article-body" :html="$page.content()"></div>
      </article>
      <ctx :if="$page.isSection().not()">
        <nav id="prev-next" aria-label="Recipe navigation">
          <div class="nav-card prev" :if="$page.prevPage?()">
            <span class="nav-label">← <span :text="$i18n.get('prev')"></span></span>
            <a href="$if.link()" :text="$if.title"></a>
          </div>
          <div class="nav-card next" :if="$page.nextPage?()">
            <span class="nav-label"><span :text="$i18n.get('next')"></span> →</span>
            <a href="$if.link()" :text="$if.title"></a>
          </div>
        </nav>
      </ctx>
      <footer id="footer">
        <div class="footer-main">
          <span>&copy; 2023 - 2025</span>
          <span>·</span>
          <a href="https://github.com/zigcc/zig-cookbook">GitHub</a>
          <span>·</span>
          <a href="http://ziglang.cc">Zig 中文社区</a>
          <span>·</span>
          <a href="http://course.ziglang.cc">Zig 圣经</a>
          <span>·</span>
          <a href="http://ask.ziglang.cc/discord">Discord</a>
          <span>·</span>
          <a href="http://ask.ziglang.cc/telegram">Telegram</a>
          <span>·</span>
          <a href="http://ask.ziglang.cc/weixin">微信群</a>
        </div>
        <div class="langs" :loop="$page.locales()">
          <a href="$loop.it.link()">
            <ctx :text="$loop.it.site().localeName()"></ctx><ctx :if="$loop.it.site().localeName().eql('English')"> (Original)</ctx>
          </a>
        </div>
      </footer>
    </div>
  </main>
</body>
